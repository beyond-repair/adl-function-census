[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adl-function-census"
version = "0.1.2"
description = "Claim-capped module-surface census for priority beyond-repair clusters. Locked snapshot checker, not a live AST crawl."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
include = ["census*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
